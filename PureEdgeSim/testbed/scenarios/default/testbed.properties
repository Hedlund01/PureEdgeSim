# =============================================================================
# Testbed parameters of the default scenario
# =============================================================================
# A district: fixed edge servers in a latency mesh, a cloud behind a few gateways,
# and fixed devices of four types calling four services. It is the scenario that
# runs when none is named.
#
# Only what this scenario sets is here: the edge layer, the services and the
# partitions. Everything else is in ../common.properties, under "testbed.", and
# any key of that file can be set here too, without the prefix.
#
#   mvn exec:java -Dexec.mainClass="partitiontestbed.Testbed"
#
# Any key can be overridden on the command line, prefixed by "testbed.":
#   -Dtestbed.edge_nodes=60 -Dtestbed.partition.1.cloud=none
# =============================================================================

# Number of edge servers. They are drawn from the template of
# edge_datacenters.xml, named dc1 to dcN, and placed uniformly on the map.
edge_nodes=40

# Share of the nodes that devices attach to (0 to 1, at least one node). A
# partition group holds devices only if it holds access nodes, so lowering this
# leaves groups of pure infrastructure. Or name them: access_nodes=dc1,dc2,dc7
access_node_fraction=0.6
access_nodes=

# Share of the nodes with an uplink to the cloud (0 to 1, at least one node). A
# group reaches the cloud only through its own gateways. Or name them.
gateway_fraction=0.15
gateway_nodes=

# Two nodes are linked when they are this close, in metres.
mesh.link_range_m=650

# Range of a device's radio, in metres. A device is attached to one access node
# at a time: the one it was placed next to, for as long as that node is this
# close and answers. When it is not, the device attaches to the nearest access
# node in range that answers, its service is deployed again from there, and the
# tasks it had on the old radio link are lost. With none in range it is cut off
# until one comes back.
devices.radio_range_m=300

# An edge server built into a vehicle. A link of the mesh to a server that moves
# exists while the two servers are within mesh.link_range_m of each other, and
# its latency follows their distance; mesh.min_degree and the guarantee of a
# connected mesh hold for the servers that stay put only. Devices move when
# their type says so in edge_devices.xml (<mobility>true</mobility>). When
# anything moves, simulation.update_interval of common.properties, a whole
# number of seconds, is the period at which the network follows.

# Share of the edge nodes that move (0 to 1). Or name them: dc3,dc8
servers.mobile_fraction=0
servers.mobile_nodes=

# How they move: a mobility model of the framework (random-waypoint,
# random-walk, gauss-markov, manhattan, levy-walk, brownian, ...), a speed in
# metres per second, and for random-waypoint the bounds, in seconds, of each
# leg and of the pause after it.
servers.mobility_model=random-waypoint
servers.speed_mps=10

# Each application of applications.xml is one service. The traits a server must
# advertise to run it are set here by its index from 0; a service left out
# draws each trait with services.trait_probability.
#
# The tasks are stateless and must be able to run on any edge server, so no
# service asks for a trait. To study intents instead, give a service traits,
# for example services.3.traits=ATTESTATION.
# 0 Video analytics       (security cameras)
# 1 Sensor telemetry      (IoT sensors)
# 2 AR assistant          (smartphones)
# 3 Payment authorization (payment terminals)
services.0.traits=
services.1.traits=
services.2.traits=
services.3.traits=

# What a device expects of the tasks of one service, when it is not what
# tasks.delivery of common.properties says for all of them: result or fire_and_forget. One run
# can so mix telemetry that expects nothing back with requests that wait for
# their answer.
#services.1.delivery=fire_and_forget

# How the stages of a service whose application is a graph of subtasks
# (<subtask> elements in applications.xml) pass their data on:
#   device  every stage returns its result to the device, which sends the next
#           stage with it (the framework's way)
#   edge    a stage that has run hands its output to the next stage from its own
#           host, on the edge, and nothing goes back to the device before the
#           last stage, which follows the delivery mode of the service
#services.0.pipeline=edge

# partition.<n>.start_s     when the edge layer splits
# partition.<n>.duration_s  how long it stays split
# partition.<n>.groups      geo:<k>    k bands of the map, west to east, with the
#                                      same number of nodes each
#                           random:<k> k groups drawn at random
#                           dc1,dc2|dc5,dc6,dc9
#                                      the groups by name; the nodes not named
#                                      form one more group
# partition.<n>.cloud       the one group that keeps its cloud uplinks: its
#                           index from 0, none, or random (one group drawn
#                           at random, or none, with the same chance each)
# partition.<n>.enabled     false to keep a partition in the file but skip it
#
# Every link between two groups is down while the partition lasts, and the
# cloud never relays traffic between two servers, so no server or device can
# reach anything in another group. At most one group keeps the cloud: the
# uplinks of the gateways of every other group are down. Devices stay with
# their access server and keep sending requests, so a group without access
# servers has no devices, and a group that keeps the cloud but holds no gateway
# cannot reach it. The run prints what each group holds when the partition
# starts.

# West and east are cut apart for five minutes, and only the west keeps the
# cloud.
partition.1.start_s=300
partition.1.duration_s=300
partition.1.groups=geo:2
partition.1.cloud=0

# Then three random groups for two minutes, one of which, or none, keeps the
# cloud, drawn at random.
partition.2.start_s=690
partition.2.duration_s=120
partition.2.groups=random:3
partition.2.cloud=random
