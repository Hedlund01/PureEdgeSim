

# =============================================================================
# Common settings of the partition testbed
# =============================================================================
# What every scenario and every run share. Three files read it, each under its
# own prefix:
#
#   simulation.<key>  the parameters of the framework, PureEdgeSim itself
#   testbed.<key>     the parameters of the testbed
#   flocky.<key>      the parameters of the Flocky strategy
#
# A key is read from three places, each replacing the one before:
#
#   1. this file
#   2. the file of the scenario, scenarios/<scenario>/, under the plain <key>:
#        simulation.<key>  in simulation_parameters.properties
#        testbed.<key>     in testbed.properties
#        flocky.<key>      in flocky.properties
#      A scenario holds only what it sets differently, and needs none of these
#      files when it changes nothing.
#   3. the command line, with the names of this file:
#        -Dsimulation.simulation_time=5 -Dtestbed.replications=10 -Dflocky.swirly.allow_local=false
#
# What defines a scenario is not here: its duration, its map, its devices, its
# edge layer, its services and its partitions are in its own files.
#
# Another common file can be used with -Dtestbed.common=path/to/file.properties.
# Times are in seconds unless the key says _ms. Inline comments are not
# supported. Reference of the simulation.* keys: docs/configuration.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Framework: execution
# -----------------------------------------------------------------------------

# Run the scenario sweep in parallel. Off: the iterations print their report one
# after the other, and every strategy gets the same tasks.
simulation.parallel_simulation=false

# Period in seconds of the mobility update and of the static energy accounting.
# A whole number of seconds when devices or edge servers move.
simulation.update_interval=1

# Wall-clock pause in seconds between sequential iterations (>= 0).
simulation.pause_length=0

# Number of generated tasks scheduled into the event queue at once (> 0).
simulation.batch_size=100

# Seed of the framework's random values: the hardware of the nodes, the paths
# of what moves, and the arrival times of the requests. Every strategy of the
# sweep gets the same draws. The testbed has its own, "testbed.seed"
# below, so the edge layer and the failures stay the same whatever this one is.
simulation.random_seed=42

# Period in seconds between two updates of the live charts.
simulation.charts_update_interval=5

# Write the console output to a file in the output folder.
simulation.save_log_file=false

# Delete the output folder before the run. Off, so that the CSV files of
# the iterations of the sweep stay next to each other.
simulation.clear_output_folder=false

# Log every task and device: far too verbose for this scenario.
simulation.deep_log_enabled=false

# Range in metres within which two devices reach each other directly (> 0).
simulation.edge_devices_range=100

# Range in metres within which a device reaches an edge node (> 0). Unused: the
# testbed attaches the devices itself, within "devices.radio_range_m" of
# the scenario.
simulation.edge_datacenters_coverage=300

# Download the container before running a request. Off: a strategy deploys a
# component once, and the requests that follow use the running instance.
simulation.enable_registry=false

# Where the registry is hosted (CLOUD or EDGE).
simulation.registry_mode=CLOUD

# Orchestrate: on. The strategy decides from the access server of each device.
simulation.enable_orchestrators=true

# EDGE. The topology creator attaches each device to its access node, and that
# node is its orchestrator.
simulation.deploy_orchestrator=EDGE

# Wait for the requests still in flight at the end, so that the last ones are
# counted instead of being cut off by the end of the run.
simulation.wait_for_all_tasks=true

# Let transfers advance over their links in steps. On: a transfer spends time on
# each link of its path, so a link can go down under it.
simulation.realistic_network_model=true

# Period in seconds at which the transfers advance (> 0).
simulation.network_update_interval=0.05

# Ignored: every gateway node has its own uplink to the cloud.
simulation.one_shared_wan_network=false

# Cloud uplink of each gateway. Megabits per second, seconds of propagation
# delay, nanojoules per bit.
simulation.wan_bandwidth=200
simulation.wan_latency=0.03
simulation.wan_nanojoules_per_bit=46.7

# Links between edge nodes. Their latency is set by "testbed.mesh.base_latency_ms"
# and "testbed.mesh.latency_per_km_ms" below, not by man_latency.
simulation.man_bandwidth=1000
simulation.man_latency=0.005
simulation.man_nanojoules_per_bit=0

# Wifi between the smartphones and their access node.
simulation.wifi_bandwidth=300
simulation.wifi_device_transmission_nanojoules_per_bit=283.17
simulation.wifi_device_reception_nanojoules_per_bit=137.01
simulation.wifi_access_point_transmission_nanojoules_per_bit=23.8
simulation.wifi_access_point_reception_nanojoules_per_bit=23.8
simulation.wifi_latency=0.005

# Wired links inside a data center.
simulation.ethernet_bandwidth=1000
simulation.ethernet_nanojoules_per_bit=40
simulation.ethernet_latency=0.002

# Cellular access of the IoT sensors.
simulation.cellular_bandwidth=100
simulation.cellular_device_transmission_nanojoules_per_bit=438.4
simulation.cellular_device_reception_nanojoules_per_bit=51.97
simulation.cellular_base_station_nanojoules_per_bit_up_link=6200
simulation.cellular_base_station_nanojoules_per_bit_down_link=20500
simulation.cellular_latency=0.03

# The strategies deploy on the edge servers and may fall back to the cloud.
simulation.orchestration_architectures=EDGE_AND_CLOUD

# The strategies under test, by the names partitiontestbed.Testbed registers
# them under. FLOCKY_LATENCY is Flocky with the Legacy evaluator of the paper,
# which ranks the candidates by the distance discovery measured; FLOCKY_SCORED
# also weighs their free memory and green energy. MVTORA is the offloading
# game of Sun et al. (TMC 2024), with local, MEC and vehicle fog computing.
# Every strategy of the list runs on the same continuum, the same failures and
# the same partitions.
simulation.orchestration_algorithms=FLOCKY_LATENCY,FLOCKY_SCORED,MVTORA

simulation.display_real_time_charts=true


# -----------------------------------------------------------------------------
# 2. Testbed
# -----------------------------------------------------------------------------

# Every node of the mesh is linked to its nearest nodes until it has this many
# links, and the mesh of the nodes that do not move is always made connected:
# only failures and partitions split it.
testbed.mesh.min_degree=2

# Latency of a link: a fixed part, plus a part that grows with its length.
testbed.mesh.base_latency_ms=1
testbed.mesh.latency_per_km_ms=4

# Devices are placed within this many metres of their access node.
testbed.devices.radius_m=150

# Whether a device in range of an access node that failed looks for another one.
# false: it waits for its node to be repaired. A device that moves out of range
# looks for another node either way.
testbed.devices.failover=true

# Whether a node can change partition group while a partition lasts. A moving
# server that is in mesh range of no server of its own group, and of a server of
# another group, asks to join that group; a device whose nearest access node in
# range is in another group asks to attach to it. The strategy decides
# (OrchestrationStrategy.admitJoin; Flocky: flocky.discovery.admit_joining).
# Admitted, the node is a member of its new group from then on: a server's mesh
# links and cloud uplink follow the group. false keeps every node in the group
# the partition gave it, and a device only attaches to access nodes of its own.
testbed.partitions.group_transfer=true

# Whether a radio link (between two devices, a device and an access node, or to
# a moving server) still exists between two groups of a partition while the two
# ends are in range. false: a partition isolates its groups completely. true: it
# cuts only the wired links between them, and a strategy whose NetworkPolicy
# bridges groups can route over such a contact.
testbed.partitions.cross_group_radio=false

# Radio between two devices: they are linked while this many metres apart or
# less, with the latency below. 0 gives devices no such radio. Only strategies
# whose NetworkPolicy uses links between devices see it.
testbed.d2d.range_m=0
testbed.d2d.base_latency_ms=2
testbed.d2d.latency_per_km_ms=4

# Seed of every random draw of the testbed: positions, roles, traits, services,
# devices, failures and partition groups. The same seed gives the same
# continuum, the same failures and the same partitions to every iteration of
# the sweep, whatever strategy it runs: a strategy draws from a source of its
# own, derived from this seed.
testbed.seed=7

# Number of times the sweep is run. Replication r moves this seed and the
# framework's random_seed by r, so each replication has its own continuum,
# failures, partition groups and tasks, the same for every strategy. The figures
# of the runs are averaged in testbed_summary.csv, with their standard deviation
# and 95% confidence interval, and the files of a run are named ..._rep<r>_...
testbed.replications=1

testbed.servers.min_move_s=60
testbed.servers.max_move_s=300
testbed.servers.min_pause_s=0
testbed.servers.max_pause_s=30

# Probability that a node advertises each trait.
testbed.traits.GREEN_ENERGY=0.3
testbed.traits.SECURE_RUNTIME=0.5
testbed.traits.NETWORK_ENCRYPTION=0.5
testbed.traits.ATTESTATION=0.2

# Traits of the cloud, which decide the services a strategy may place on it.
testbed.cloud.traits=SECURE_RUNTIME,NETWORK_ENCRYPTION,ATTESTATION

testbed.services.trait_probability=0

# What a device expects of the stateless tasks it sends:
#   result           the task is done when its result reaches the device that
#                    sent it. A cut on the way back loses the result unless the
#                    strategy sends it again.
#   fire_and_forget  the device sends the task and expects nothing back: the task
#                    is done once it has run on a host, and no result crosses the
#                    network.
# Run both to compare them; the output files are named after the mode, or
# "mixed" when a service says otherwise with services.<n>.delivery:
#   -Dtestbed.tasks.delivery=fire_and_forget
testbed.tasks.delivery=result

# What a task must achieve to count, the same for every strategy, so that any
# two compare on it (services.<n>.requirement sets it per service):
#   deadline  done before its deadline. A late task is as bad as a lost one, and
#             losing some is accepted: for interactive services.
#   lossless  done at all, within delivery_window_s of its creation, late or
#             not: for telemetry, payments, maps, where nothing may be lost.
# Every task gets one outcome: on time, late (after its deadline, within the
# window), lost (not done within the window), or censored (created too close to
# the end of the run to be judged). services.<n>.target_pct sets the share of a
# service's tasks that must meet its requirement, and the report counts the
# services that reach their target.
testbed.tasks.requirement=deadline
testbed.tasks.delivery_window_s=60

# An instance of a service holds this much memory on its host and takes this
# long to start, whatever the strategy that starts it (services.<n>.memory_mb and
# services.<n>.startup_ms set them per service). A task that reaches a host
# while its instance starts waits for it.
testbed.instances.memory_mb=512
testbed.instances.startup_ms=500

# Each mesh link, cloud uplink and node fails after an exponential time of mean
# one over its rate, and is repaired after an exponential time of the given
# mean. A rate of 0 turns the failure off. A failed node is cut off, with every
# link it has, until it is repaired; its devices attach to another access node
# in range meanwhile (devices.failover). node_failure_mode says what it keeps:
#   isolate  its state: what ran on it finishes, and its instances stay, but
#            nothing gets in or out until it returns;
#   crash    nothing: what ran or waited on it is lost, and so are its
#            instances; the strategy is told when it runs again.
testbed.failures.link_failure_rate_per_hour=0.5
testbed.failures.link_mean_repair_s=60
testbed.failures.wan_failure_rate_per_hour=0.5
testbed.failures.wan_mean_repair_s=120
testbed.failures.node_failure_rate_per_hour=0
testbed.failures.node_mean_repair_s=300
testbed.failures.node_failure_mode=isolate

# Period of the rows of the timeline file.
testbed.metrics.sample_interval_s=10

# With display_real_time_charts=true in the files of the scenario, a
# Flocky deployment map is shown next to the charts of the framework. The run
# is far faster than real time, so each redraw (every charts_update_interval
# simulated seconds) is followed by this pause of wall-clock time. 0 runs at
# full speed. With save_charts=true, the map is also saved just before and half
# way through every partition, and at the end of the run.
testbed.visualizer.frame_pause_ms=100

# -----------------------------------------------------------------------------
# 3. Flocky strategy (FLOCKY_LATENCY and FLOCKY_SCORED)
# -----------------------------------------------------------------------------

# Each service of the testbed is one OAM component. Implementations
# (ComponentDefinitions) per component: each is a unikernel, which needs
# SECURE_RUNTIME, with this probability, a container otherwise. Every instance
# holds the memory of its service (testbed.instances.memory_mb), as it does for
# every strategy. No unikernels, so that the stateless tasks can run on any edge
# server.
flocky.oam.implementations_per_service=2
flocky.oam.unikernel_probability=0

# Number of servers each definition is installed on at the start, or "all". With a number, it
# spreads to the others through the repositories, but not across a partition.
flocky.oam.seed_nodes_per_definition=all

# Period of a discovery round. The paper evaluates with 3 s.
flocky.discovery.interval_s=3

# Maximum discovery distance, as a ping round trip time. The paper evaluates 10
# and 20 ms.
flocky.discovery.max_distance_ms=20

# Assumed density (rho_assumed): a node that knows fewer nodes than this widens
# its range by the square root of the ratio.
flocky.discovery.assumed_density=6

# Nodes each node is started with.
flocky.discovery.bootstrap_peers=2

# Time a ping waits for an answer. Counted as traffic only: a round is short
# next to the interval between rounds.
flocky.discovery.rpc_timeout_ms=500

# A node that stopped answering is pinged again every round for this long
# before it is forgotten, so that both sides of a healed partition find each
# other again. 0 forgets at once, as the algorithm of the paper does.
flocky.discovery.forget_after_s=120

# Whether a node of another partition group that comes in range is admitted.
# Flocky's discovery takes any node that pings it, so its groups are open:
# true. false closes them, and a server or device that drifts away from its
# group stays cut off instead of joining the one it reaches.
flocky.discovery.admit_joining=true

# Period at which a node pulls the summary of every known node it can reach.
# The paper evaluates with 5 s.
flocky.repository.interval_s=5

# Deploy on the cloud when no edge node of the view takes the component, if the
# node can reach the cloud.
flocky.swirly.cloud_fallback=true

# Move a component as soon as its host leaves the view of the device's node,
# rather than waiting for a request to fail on it.
flocky.swirly.proactive_migration=true

# Let a node deploy on itself.
flocky.swirly.allow_local=true

# Time a deployment API call waits for a node that cannot be reached.
flocky.swirly.rpc_timeout_ms=1000

# Time the orchestration algorithm itself takes: 0.2 to 0.4 ms in the paper.
flocky.swirly.processing_ms=0.3

# An instance whose client could not reach it to release it is freed after this
# long, as by an expired lease.
flocky.deployment.orphan_timeout_s=60

# Clients one instance serves before Swirly starts another.
flocky.deployment.max_clients_per_instance=8

# Share of a node's memory lent to Flocky deployments (0 to 1).
flocky.deployment.memory_share=0.5

flocky.messages.ping_bytes=120
flocky.messages.node_entry_bytes=40
flocky.messages.summary_base_bytes=600
flocky.messages.definition_id_bytes=26
flocky.messages.manifest_bytes=2000


# =============================================================================
# Baseline strategies (partitiontestbed.baselines)
# =============================================================================
# ACCESS_SERVER runs every task where it arrives; CLOUD_ONLY on the cloud;
# RETRY is ACCESS_SERVER with acknowledgements: the device resends a task, and a
# host its result, every retry.interval_s until acknowledged, until the deadline
# of a deadline task or the window of a lossless one; REPLICATED runs every task
# on the access server and on copies-1 of its mesh neighbours at once.
baselines.retry.interval_s=1
baselines.replicated.copies=2


# =============================================================================
# MVTORA strategy (partitiontestbed.mvtora)
# =============================================================================
# Sun et al., "Joint Task Offloading and Resource Allocation in Aerial-
# Terrestrial UAV Networks With Edge and Fog Computing for Post-Disaster
# Rescue", IEEE TMC 23(9), 2024. Each access server is the controller (the
# paper's E-UAV) of the devices attached to it; the moving edge servers are the
# vehicle fog nodes. A device computes locally, offloads whole to its
# controller, or divides its task among the fog nodes it hears. Values left out
# take those of Table II of the paper.

# A round starts with the first request a controller gets, and decides for
# every request that came within this window. A device that has no decision
# after decision_timeout_ms computes locally, or, without a processor, sends the
# task to its controller.
mvtora.round.collect_ms=50
mvtora.round.decision_timeout_ms=500

# Fog nodes broadcast their idle cores, backlog and position this often to the
# devices in their radio range; a device ignores a beacon older than max_age_s.
mvtora.beacon.interval_s=1
mvtora.beacon.max_age_s=3

# Which edge servers are fog nodes: mobile (the vehicles, as in the paper) or
# any (every server a device hears other than its controller), and K_n, the most
# a task is divided over.
mvtora.vfc.fog_nodes=mobile
mvtora.vfc.max_fog_nodes=5

# The utility of eq. 21: alpha log(beta + T_max - T) - energy_weight E
# - price_per_ghz F. beta is not given in the paper; 1 keeps the revenue of a
# task done in time non-negative.
mvtora.utility.alpha=0.9
mvtora.utility.energy_weight=0.1
mvtora.utility.beta=1
mvtora.utility.price_per_ghz=0.001
mvtora.energy.capacitance=1e-28
mvtora.energy.transmit_power_dbm=20

# Algorithm 1 (game), 2 (bisection) and 4 (genetic algorithm).
mvtora.game.max_iterations=100
mvtora.bisection.accuracy=1e-6
mvtora.bisection.gamma_bound=1e4
mvtora.ga.generations=200
mvtora.ga.population=50
mvtora.ga.crossover=0.8
mvtora.ga.mutation=0.1

# How the controller estimates the rate of a radio link: nominal (the configured
# bandwidth of the device's radio: the channel state known, as the paper
# assumes) or channel (the LoS model of eq. 6 to 10 from the positions the
# devices and fog nodes report, with the parameters below).
mvtora.rate.model=nominal
mvtora.channel.device_altitude_m=100
mvtora.channel.controller_altitude_m=300
mvtora.channel.subchannel_bandwidth_hz=200000
mvtora.channel.subchannels=5
mvtora.channel.path_loss_reference=1.42e-4
mvtora.channel.nlos_attenuation=0.2
mvtora.channel.los_a=10
mvtora.channel.los_b=0.6
mvtora.channel.path_loss_exponent=2.3
mvtora.channel.noise_dbm_per_hz=-174
mvtora.channel.half_beamwidth_rad=0.7854
mvtora.channel.antenna_gain=2.2846

# Sizes of its messages, in bytes.
mvtora.messages.request_bytes=200
mvtora.messages.fog_entry_bytes=40
mvtora.messages.decision_bytes=100
mvtora.messages.beacon_bytes=80
