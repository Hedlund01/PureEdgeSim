# =============================================================================
# PureEdgeSim parameters of the UAV scenario
# =============================================================================
# What the framework reads, and this scenario sets: its duration, its map, its
# devices and its display. Everything else, the network capacities and the
# strategies under test among it, is in ../common.properties under
# "simulation.", and any key of that file can be set here too, without the
# prefix. On the command line: -Dsimulation.simulation_time=5
# =============================================================================

# Simulated duration in minutes (> 0).
simulation_time=12

# Show the live charts window, with the deployment map. Turn it off to run
# without a display.
display_real_time_charts=false

# Close the charts window automatically at the end of the run.
auto_close_real_time_charts=true

# Save the charts as PNG and SVG at the end of the run.
save_charts=false

# Size of the map in metres (> 0): a district of three kilometres a side. The
# edge nodes are placed uniformly on it.
length=3000
width=3000

# Number of devices. Sweep them with min < max and a counter size.
min_number_of_edge_devices=60
max_number_of_edge_devices=60
edge_device_counter_size=60
