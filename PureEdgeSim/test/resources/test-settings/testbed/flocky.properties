# =============================================================================
# Flocky parameters of the tests.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. OAM catalog
# -----------------------------------------------------------------------------

# Each service of the testbed is one OAM component. Implementations
# (ComponentDefinitions) per component: each is a unikernel, which needs
# SECURE_RUNTIME, with this probability, a container otherwise, and reserves a
# memory drawn between the two bounds, in megabytes. No unikernels, so that the
# stateless tasks can run on any edge server.
oam.implementations_per_service=2
oam.unikernel_probability=0
oam.min_memory_mb=256
oam.max_memory_mb=2048

# Number of servers each definition is installed on at the start, or "all". With a number, it
# spreads to the others through the repositories, but not across a partition.
oam.seed_nodes_per_definition=all


# -----------------------------------------------------------------------------
# 2. Discovery service (Algorithm 1 of the paper)
# -----------------------------------------------------------------------------

# Period of a discovery round. The paper evaluates with 3 s.
discovery.interval_s=3

# Maximum discovery distance, as a ping round trip time. The paper evaluates 10
# and 20 ms.
discovery.max_distance_ms=20

# Assumed density (rho_assumed): a node that knows fewer nodes than this widens
# its range by the square root of the ratio.
discovery.assumed_density=6

# Nodes each node is started with.
discovery.bootstrap_peers=2

# Time a ping waits for an answer. Counted as traffic only: a round is short
# next to the interval between rounds.
discovery.rpc_timeout_ms=500

# A node that stopped answering is pinged again every round for this long
# before it is forgotten, so that both sides of a healed partition find each
# other again. 0 forgets at once, as the algorithm of the paper does.
discovery.forget_after_s=120


# -----------------------------------------------------------------------------
# 3. Metadata repository
# -----------------------------------------------------------------------------

# Period at which a node pulls the summary of every known node it can reach.
# The paper evaluates with 5 s.
repository.interval_s=5


# -----------------------------------------------------------------------------
# 4. Swirly and deployment services
# -----------------------------------------------------------------------------

# Deploy on the cloud when no edge node of the view takes the component, if the
# node can reach the cloud.
swirly.cloud_fallback=true

# Move a component as soon as its host leaves the view of the device's node,
# rather than waiting for a request to fail on it.
swirly.proactive_migration=true

# Let a node deploy on itself.
swirly.allow_local=true

# Time a deployment API call waits for a node that cannot be reached.
swirly.rpc_timeout_ms=1000

# Time the orchestration algorithm itself takes: 0.2 to 0.4 ms in the paper.
swirly.processing_ms=0.3

# An instance whose client could not reach it to release it is freed after this
# long, as by an expired lease.
deployment.orphan_timeout_s=60

# Clients one instance serves before Swirly starts another.
deployment.max_clients_per_instance=8

# Share of a node's memory lent to Flocky deployments (0 to 1).
deployment.memory_share=0.5


# -----------------------------------------------------------------------------
# 5. Message sizes, in bytes, for the control plane traffic
# -----------------------------------------------------------------------------

messages.ping_bytes=120
messages.node_entry_bytes=40
messages.summary_base_bytes=600
messages.definition_id_bytes=26
messages.manifest_bytes=2000
