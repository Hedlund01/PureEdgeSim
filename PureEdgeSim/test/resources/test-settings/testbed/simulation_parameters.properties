# =============================================================================
# Testbed test parameters: the default scenario, shortened to four minutes,
# forty devices and one algorithm, so that each test run takes about a second.
# =============================================================================
# Scenario: an edge-to-cloud continuum of a few tens of edge servers spread over
# a district, end devices of four types calling four services, and a cloud data
# center behind a few gateways. The strategy under test decides where the
# services run, while the network fails and splits into partitions under it.
#
# The edge layer, the services, the failures and the partitions are in
# testbed.properties, and each strategy has its own file (flocky.properties).
# This file holds what the framework itself reads: the duration, the map, the
# devices, the network capacities, and the sweep of strategies.
#
#   mvn exec:java -Dexec.mainClass="partitiontestbed.Testbed"
#
# Format: one key=value pair per line. Lines starting with # are comments.
# Keys and allowed values are case-sensitive. Inline comments are not
# supported. Full reference: docs/configuration.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Simulation duration and execution
# -----------------------------------------------------------------------------

# Simulated duration in minutes (> 0). Fifteen minutes: five to converge and
# deploy, the partitions of testbed.properties, and the healing after them.
simulation_time=4

# Run the scenario sweep in parallel. Off: the iterations print their
# report one after the other.
parallel_simulation=false

# Period in seconds of the mobility update and of the static energy accounting.
update_interval=1

# Wall-clock pause in seconds between sequential iterations (>= 0).
pause_length=0

# Number of generated tasks scheduled into the event queue at once (> 0).
batch_size=100

# Seed of the framework's random values: the devices' applications and the
# arrival times of their requests. The testbed has its own, "seed" in
# testbed.properties, so the edge layer and the failures stay the same whatever
# this one is.
random_seed=42


# -----------------------------------------------------------------------------
# 2. Display and output
# -----------------------------------------------------------------------------

# Show the live charts window. Off, so the run works without a display.
display_real_time_charts=false

# Close the charts window automatically at the end of the run.
auto_close_real_time_charts=true

# Period in seconds between two updates of the live charts.
charts_update_interval=5

# Save the charts as PNG and SVG at the end of the run.
save_charts=false

# Write the console output to a file in the output folder.
save_log_file=false

# Delete the output folder before the run. Off, so that the CSV files of
# the iterations of the sweep stay next to each other.
clear_output_folder=false

# Log every task and device: far too verbose for this scenario.
deep_log_enabled=false


# -----------------------------------------------------------------------------
# 3. Topology
# -----------------------------------------------------------------------------

# Size of the map in metres (> 0): a district of three kilometres a side. The
# edge nodes are placed uniformly on it.
length=3000
width=3000

# Range in metres within which two devices reach each other directly (> 0).
edge_devices_range=100

# Range in metres within which a device reaches an edge node (> 0). Wider than
# "devices.radius_m" of testbed.properties, so a device always reaches the node it
# is attached to.
edge_datacenters_coverage=300


# -----------------------------------------------------------------------------
# 4. Container registry
# -----------------------------------------------------------------------------

# Download the container before running a request. Off: a strategy deploys a
# component once, and the requests that follow use the running instance.
enable_registry=false

# Where the registry is hosted (CLOUD or EDGE).
registry_mode=CLOUD


# -----------------------------------------------------------------------------
# 5. Orchestration
# -----------------------------------------------------------------------------

# Orchestrate: on. The strategy decides from the access server of each device.
enable_orchestrators=true

# EDGE. The topology creator attaches each device to its access node, and that
# node is its orchestrator.
deploy_orchestrator=EDGE

# Wait for the requests still in flight at the end, so that the last ones are
# counted instead of being cut off by the end of the run.
wait_for_all_tasks=true


# -----------------------------------------------------------------------------
# 6. Edge devices
# -----------------------------------------------------------------------------

# Number of devices. Sweep them with min < max and a counter size.
min_number_of_edge_devices=40
max_number_of_edge_devices=40
edge_device_counter_size=40


# -----------------------------------------------------------------------------
# 7. Network
# -----------------------------------------------------------------------------

# Let transfers advance over their links in steps. On: a transfer spends time on
# each link of its path, so a link can go down under it.
realistic_network_model=true

# Period in seconds at which the transfers advance (> 0).
network_update_interval=0.05

# Ignored: every gateway node has its own uplink to the cloud.
one_shared_wan_network=false

# Cloud uplink of each gateway. Megabits per second, seconds of propagation
# delay, nanojoules per bit.
wan_bandwidth=200
wan_latency=0.03
wan_nanojoules_per_bit=46.7

# Links between edge nodes. Their latency is set by "mesh.base_latency_ms" and
# "mesh.latency_per_km_ms" of testbed.properties, not by man_latency.
man_bandwidth=1000
man_latency=0.005
man_nanojoules_per_bit=0

# Wifi between the devices and their access node.
wifi_bandwidth=300
wifi_device_transmission_nanojoules_per_bit=283.17
wifi_device_reception_nanojoules_per_bit=137.01
wifi_access_point_transmission_nanojoules_per_bit=23.8
wifi_access_point_reception_nanojoules_per_bit=23.8
wifi_latency=0.005

# Wired links inside a data center.
ethernet_bandwidth=1000
ethernet_nanojoules_per_bit=40
ethernet_latency=0.002

# Cellular access, unused: every device is on wifi.
cellular_bandwidth=100
cellular_device_transmission_nanojoules_per_bit=438.4
cellular_device_reception_nanojoules_per_bit=51.97
cellular_base_station_nanojoules_per_bit_up_link=6200
cellular_base_station_nanojoules_per_bit_down_link=20500
cellular_latency=0.03


# -----------------------------------------------------------------------------
# 8. Scenarios to sweep
# -----------------------------------------------------------------------------

# The strategies deploy on the edge servers and may fall back to the cloud.
orchestration_architectures=EDGE_AND_CLOUD

# The strategies under test, by the names partitiontestbed.Testbed registers
# them under. FLOCKY_LATENCY is Flocky with the Legacy evaluator of the paper,
# which ranks the candidates by the distance discovery measured; FLOCKY_SCORED
# also weighs their free memory and green energy. Every strategy of the list
# runs on the same continuum, the same failures and the same partitions.
orchestration_algorithms=FLOCKY_LATENCY
