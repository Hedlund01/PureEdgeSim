# =============================================================================
# Testbed parameters of the tests: twenty edge servers, no random failure, and
# one partition from 90 s to 180 s that the tests reshape with testbed.*
# overrides.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Edge layer
# -----------------------------------------------------------------------------

# Number of edge servers. They are drawn from the template of
# edge_datacenters.xml, named dc1 to dcN, and placed uniformly on the map.
edge_nodes=20

# Share of the nodes that devices attach to (0 to 1, at least one node). A
# partition group holds devices only if it holds access nodes, so lowering this
# leaves groups of pure infrastructure. Or name them: access_nodes=dc1,dc2,dc7
access_node_fraction=0.6
access_nodes=

# Share of the nodes with an uplink to the cloud (0 to 1, at least one node). A
# group reaches the cloud only through its own gateways. Or name them.
gateway_fraction=0.15
gateway_nodes=

# Two nodes are linked when they are this close, in metres.
mesh.link_range_m=650
# Every node is then linked to its nearest nodes until it has this many links.
# The mesh is always made connected: only failures and partitions split it.
mesh.min_degree=2
# Latency of a link: a fixed part, plus a part that grows with its length.
mesh.base_latency_ms=1
mesh.latency_per_km_ms=4

# Devices are placed within this many metres of their access node.
devices.radius_m=150

# Seed of every random draw of the testbed: positions, roles, traits, services,
# devices, failures and partition groups. The same seed gives the same
# continuum, the same failures and the same partitions to every iteration of
# the sweep, whatever strategy it runs: a strategy draws from a source of its
# own, derived from this seed.
seed=7


# -----------------------------------------------------------------------------
# 2. Traits
# -----------------------------------------------------------------------------

# Probability that a node advertises each trait.
traits.GREEN_ENERGY=0.3
traits.SECURE_RUNTIME=0.5
traits.NETWORK_ENCRYPTION=0.5
traits.ATTESTATION=0.2

# Traits of the cloud, which decide the services a strategy may place on it.
cloud.traits=SECURE_RUNTIME,NETWORK_ENCRYPTION,ATTESTATION


# -----------------------------------------------------------------------------
# 3. Services
# -----------------------------------------------------------------------------

# Each application of applications.xml is one service. The traits a server must
# advertise to run it are set here by its index from 0; a service left out
# draws each trait with services.trait_probability.
#
# The tasks are stateless and must be able to run on any edge server, so no
# service asks for a trait. To study intents instead, give a service traits,
# for example services.3.traits=ATTESTATION.
# 0 Video analytics       (security cameras)
# 1 Sensor telemetry      (IoT sensors)
# 2 AR assistant          (smartphones)
# 3 Payment authorization (payment terminals)
services.0.traits=
services.1.traits=
services.2.traits=
services.3.traits=
services.trait_probability=0


# -----------------------------------------------------------------------------
# 4. Tasks
# -----------------------------------------------------------------------------

# What a device expects of the stateless tasks it sends:
#   result           the task must bring its result back to the device that sent
#                    it, through its access server, before its deadline. A cut on
#                    the way back loses the task even though it ran.
#   fire_and_forget  the device sends the task and expects nothing back: the task
#                    has succeeded once it has run on its host before its
#                    deadline, and no result crosses the network.
# Run both to compare them; the output files are named after the mode:
#   -Dtestbed.tasks.delivery=fire_and_forget
tasks.delivery=result


# -----------------------------------------------------------------------------
# 5. Random failures
# -----------------------------------------------------------------------------
# Each mesh link, cloud uplink and node fails after an exponential time of mean
# one over its rate, and is repaired after an exponential time of the given
# mean. A rate of 0 turns the failure off. A failed node keeps its state: it is
# cut off, with every link it has, until it is repaired.

failures.link_failure_rate_per_hour=0
failures.link_mean_repair_s=60
failures.wan_failure_rate_per_hour=0
failures.wan_mean_repair_s=120
failures.node_failure_rate_per_hour=0
failures.node_mean_repair_s=300


# -----------------------------------------------------------------------------
# 6. Partitions
# -----------------------------------------------------------------------------
# partition.<n>.start_s     when the edge layer splits
# partition.<n>.duration_s  how long it stays split
# partition.<n>.groups      geo:<k>    k bands of the map, west to east, with the
#                                      same number of nodes each
#                           random:<k> k groups drawn at random
#                           dc1,dc2|dc5,dc6,dc9
#                                      the groups by name; the nodes not named
#                                      form one more group
# partition.<n>.cloud       the one group that keeps its cloud uplinks: its
#                           index from 0, none, or random (one group drawn
#                           at random, or none, with the same chance each)
# partition.<n>.enabled     false to keep a partition in the file but skip it
#
# Every link between two groups is down while the partition lasts, and the
# cloud never relays traffic between two servers, so no server or device can
# reach anything in another group. At most one group keeps the cloud: the
# uplinks of the gateways of every other group are down. Devices stay with
# their access server and keep sending requests, so a group without access
# servers has no devices, and a group that keeps the cloud but holds no gateway
# cannot reach it. The run prints what each group holds when the partition
# starts.

# West and east are cut apart for ninety seconds, and only the west keeps the
# cloud.
partition.1.start_s=90
partition.1.duration_s=90
partition.1.groups=geo:2
partition.1.cloud=0



# -----------------------------------------------------------------------------
# 7. Metrics
# -----------------------------------------------------------------------------

# Period of the rows of the timeline file.
metrics.sample_interval_s=10


# -----------------------------------------------------------------------------
# 8. Visualisation
# -----------------------------------------------------------------------------
# With display_real_time_charts=true in simulation_parameters.properties, a
# Flocky deployment map is shown next to the charts of the framework. The run
# is far faster than real time, so each redraw (every charts_update_interval
# simulated seconds) is followed by this pause of wall-clock time. 0 runs at
# full speed. With save_charts=true, the map is also saved just before and half
# way through every partition, and at the end of the run.
visualizer.frame_pause_ms=100
